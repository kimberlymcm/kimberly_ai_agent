name = "kimberly-ai-agent"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# /kimberly* is the agent; the other routes expose discovery files at the domain root.
routes = [
  { pattern = "missiondistrict.ai/kimberly*", zone_name = "missiondistrict.ai" },
  # Root-level discovery paths; there is no other site on this domain.
  { pattern = "missiondistrict.ai/", zone_name = "missiondistrict.ai" },
  { pattern = "missiondistrict.ai/llms.txt", zone_name = "missiondistrict.ai" },
  { pattern = "missiondistrict.ai/robots.txt", zone_name = "missiondistrict.ai" },
  { pattern = "missiondistrict.ai/.well-known/*", zone_name = "missiondistrict.ai" },
]

# Create with: npx wrangler kv namespace create INBOX  (paste the id below)
[[kv_namespaces]]
binding = "INBOX"
id = "95a75fd30df14039a2dd954d344ae5b8"

# Secrets (npx wrangler secret put <NAME>):
#   ANTHROPIC_API_KEY  - used to answer questions
#   ADMIN_TOKEN        - bearer token for reading the inbox at /kimberly/admin/inbox
#   RESEND_API_KEY     - sends email alerts
#   ALERT_TO           - the address alerts go to
# Optional var ALERT_FROM (default "Kimberly Agent <agent@missiondistrict.ai>"); the sending domain must be verified in Resend.
